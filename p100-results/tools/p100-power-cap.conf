# Configuration for /usr/local/sbin/p100-power-cap (sourced as bash).
# GPUs are matched by stable UUID, never by nvidia-smi index.
LIMIT_W=150
# Tesla P100 #1 (PCI 0000:04:00.0, NUMA node 0) and #2 (PCI 0000:81:00.0, NUMA node 1)
P100_UUIDS=(GPU-00000000-0000-0000-0000-000000000000 GPU-00000000-0000-0000-0000-000000000001)
# How long to wait for the NVIDIA driver and both GPUs after boot.
WAIT_SECS=180
