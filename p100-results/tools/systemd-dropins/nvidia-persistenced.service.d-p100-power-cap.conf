# Stopping nvidia-persistenced turns persistence mode off on both P100s; when nothing holds them the driver then resets
# their power limit to 250 W (2026-11-13 06:19, an unattended upgrade). Re-apply persistence and the 150 W cap after
# every start. "-": a failed cap does not stop the daemon (strata-bitlamas's own ExecStartPre refuses to start then).
[Service]
ExecStartPost=-+/usr/local/sbin/p100-power-cap
