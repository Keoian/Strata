# Apply the 150 W cap before every start, not only at boot (2026-11-13): an unattended upgrade restarted this service
# and nvidia-persistenced together at 06:19, the cards had no client for a moment, the driver reset them to 250 W, and
# the boot-time p100-power-cap.service (Requires= above, already active) did not run again. Fails closed: no cap, no start.
[Service]
ExecStartPre=+/usr/local/sbin/p100-power-cap
