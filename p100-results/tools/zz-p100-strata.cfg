# p100-bitlamas (2026-11-06): IOMMU passthrough (pinned host<->GPU copies +6..20% measured, cross-socket penalty gone)
# and no kdump reservation (USE_KDUMP=0 already; the 4.25 GiB crashkernel region sat unused, mostly on NUMA node 1).
# Sorts after kdump-tools.cfg, so it strips that file's crashkernel= instead of editing a package conffile.
# Rollback: sudo rm /etc/default/grub.d/zz-p100-strata.cfg && sudo update-grub && sudo reboot
GRUB_CMDLINE_LINUX_DEFAULT="$(echo "$GRUB_CMDLINE_LINUX_DEFAULT" | sed -E 's/(^| )crashkernel=[^ ]*//g') iommu=pt"
